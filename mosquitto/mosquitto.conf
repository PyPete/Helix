# ─── Mosquitto configuration — Helix Orchestration (local dev) ───────────────
# Provides two listeners:
#   1883  — plain MQTT/TCP         (used by MqttTrendBridge in the Site Server)
#   9001  — MQTT over WebSocket    (used by any browser/Tauri/React UI client)
#
# Anonymous access is allowed for local development.
# For production, replace with password_file + TLS.
# ─────────────────────────────────────────────────────────────────────────────

# Plain MQTT/TCP listener
listener 1883
protocol mqtt

# MQTT over WebSocket listener
listener 9001
protocol websockets

# Allow unauthenticated connections in development
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
