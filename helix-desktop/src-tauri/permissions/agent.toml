[[permission]]
identifier = "allow-agent-broker"
description = "Allows only the fixed-target native Agent broker commands."
commands.allow = [
  "bootstrap_agent_session",
  "agent_session_status",
  "agent_logout",
  "agent_revoke_session",
  "agent_status",
  "scientific_create",
  "scientific_create_kind",
  "scientific_derive_procedure",
  "scientific_adopt_procedure",
  "scientific_publish",
  "scientific_list",
  "scientific_list_kind",
  "scientific_read",
  "scientific_history",
  "scientific_read_revision",
  "scientific_operation",
  "sample_list",
  "sample_read",
  "sample_confirm",
  "sample_append_event",
  "sample_events",
  "agent_propose",
  "agent_approve_policy",
  "agent_dispatch",
  "agent_evidence",
  "agent_operation_status",
  "agent_evidence_cursor",
  "agent_experiment_status",
  "agent_experiment_start",
  "agent_experiment_control"
]
