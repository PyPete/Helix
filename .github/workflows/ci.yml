name: CI

on:
  push:
    branches:
      - dev
      - stage
      - main
  pull_request:
    branches:
      - dev
      - stage
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Helix.Orchestration.slnx -p:Configuration=Release

      - name: Build
        run: dotnet build Helix.Orchestration.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Helix.Orchestration.slnx --no-build -c Release --logger trx --results-directory test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Helix.Orchestration.slnx -p:Configuration=Release

      - name: Check formatting (informational)
        run: dotnet format Helix.Orchestration.slnx --verify-no-changes --no-restore --verbosity diagnostic
        continue-on-error: true

  publish:
    name: Publish Artifact
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish core project
        run: dotnet publish Helix.Orchestration.Core/Helix.Orchestration.Core.csproj -c Release -o publish/

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: helix-orchestration-core-publish
          path: publish/
          retention-days: 30
