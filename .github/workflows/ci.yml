name: CI

on:
  push:
    branches:
      - dev
      - stage
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
      - stage
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: helix_orchestration
          POSTGRES_USER: helix
          POSTGRES_PASSWORD: helix_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helix -d helix_orchestration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: helix_orchestration
      PGUSER: helix
      PGPASSWORD: helix_dev_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Helix.Orchestration.slnx -p:Configuration=Release

      - name: Build
        run: dotnet build Helix.Orchestration.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test Helix.Orchestration.slnx
          --no-build -c Release
          --logger trx
          --results-directory test-results
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: test-results/**/coverage.cobertura.xml
          retention-days: 30

  dashboard:
    name: Dashboard Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: helix-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: helix-dashboard
        run: npm ci

      - name: Run tests
        working-directory: helix-dashboard
        run: npm test -- --run

      - name: Build
        working-directory: helix-dashboard
        run: npm run build

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Helix.Orchestration.slnx -p:Configuration=Release

      - name: Check formatting (informational)
        run: dotnet format Helix.Orchestration.slnx --verify-no-changes --no-restore --verbosity diagnostic
        continue-on-error: true

  tauri-build:
    name: Tauri Build (${{ matrix.platform }})
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs-on: ubuntu-latest
            bundles: appimage,deb
            artifact-path: helix-desktop/src-tauri/target/release/bundle/
          - platform: macos
            runs-on: macos-latest
            bundles: dmg,app
            artifact-path: helix-desktop/src-tauri/target/release/bundle/
          - platform: windows
            runs-on: windows-latest
            bundles: nsis,msi
            artifact-path: helix-desktop/src-tauri/target/release/bundle/

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE=$(node -p "require('./helix-desktop/src-tauri/tauri.conf.json').version")
            SHA=$(git rev-parse --short HEAD)
            VERSION="${BASE}-dev.${SHA}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Stamp version
        shell: bash
        run: |
          node helix-desktop/scripts/stamp-version.js "${{ steps.version.outputs.VERSION }}"
          node helix-desktop/scripts/stamp-cargo-version.js "${{ steps.version.outputs.VERSION }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: helix-desktop/package-lock.json

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            helix-desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('helix-desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: helix-desktop
        run: npm ci

      - name: Build Tauri (${{ matrix.platform }})
        working-directory: helix-desktop
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Upload Tauri bundle
        uses: actions/upload-artifact@v4
        with:
          name: helix-desktop-${{ matrix.platform }}-${{ steps.version.outputs.VERSION }}
          path: ${{ matrix.artifact-path }}
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: tauri-build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE=$(node -p "require('./helix-desktop/src-tauri/tauri.conf.json').version")
            SHA=$(git rev-parse --short HEAD)
            VERSION="${BASE}-dev.${SHA}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: helix-desktop-*
          path: release-artifacts/
          merge-multiple: false

      - name: Publish dev release (rolling)
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete dev --yes 2>/dev/null || true
          git push origin :refs/tags/dev 2>/dev/null || true
          TITLE="Helix Desktop ${{ steps.version.outputs.VERSION }}"
          NOTES="Bleeding-edge build from the dev branch. Commit: ${{ github.sha }}"
          readarray -d "" FILES < <(find release-artifacts -type f -print0)
          gh release create dev --title "$TITLE" --notes "$NOTES" --prerelease "${FILES[@]}"

      - name: Publish versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Helix Desktop ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-artifacts/**/*

  publish:
    name: Publish Artifact
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish core project
        run: dotnet publish Helix.Orchestration.Core/Helix.Orchestration.Core.csproj -c Release -o publish/

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: helix-orchestration-core-publish
          path: publish/
          retention-days: 30
