name: CI

on:
  push:
    branches:
      - dev
      - stage
      - main
  pull_request:
    branches:
      - dev
      - stage
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: helix_orchestration
          POSTGRES_USER: helix
          POSTGRES_PASSWORD: helix_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helix -d helix_orchestration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: helix_orchestration
      PGUSER: helix
      PGPASSWORD: helix_dev_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Helix.Orchestration.slnx -p:Configuration=Release

      - name: Build
        run: dotnet build Helix.Orchestration.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test Helix.Orchestration.slnx
          --no-build -c Release
          --logger trx
          --results-directory test-results
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: test-results/**/coverage.cobertura.xml
          retention-days: 30

  dashboard:
    name: Dashboard Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: helix-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: helix-dashboard
        run: npm ci

      - name: Run tests
        working-directory: helix-dashboard
        run: npm test -- --run

      - name: Build
        working-directory: helix-dashboard
        run: npm run build

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Helix.Orchestration.slnx -p:Configuration=Release

      - name: Check formatting (informational)
        run: dotnet format Helix.Orchestration.slnx --verify-no-changes --no-restore --verbosity diagnostic
        continue-on-error: true

  tauri-build:
    name: Tauri Linux Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: helix-desktop/package-lock.json

      - name: Install system dependencies (Tauri Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            helix-desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('helix-desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: helix-desktop
        run: npm ci

      - name: Build Tauri (Linux)
        working-directory: helix-desktop
        run: npm run tauri build -- --bundles appimage,deb

      - name: Upload Tauri bundle
        uses: actions/upload-artifact@v4
        with:
          name: helix-desktop-linux
          path: helix-desktop/src-tauri/target/release/bundle/
          retention-days: 7

  publish:
    name: Publish Artifact
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish core project
        run: dotnet publish Helix.Orchestration.Core/Helix.Orchestration.Core.csproj -c Release -o publish/

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: helix-orchestration-core-publish
          path: publish/
          retention-days: 30
