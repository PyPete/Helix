# Helix Orchestration â€” local dev services
# Usage:
#   docker compose up -d          start all services
#   docker compose down -v        stop and remove containers + volumes
#
# Services:
#   mosquitto         MQTT broker â€” plain TCP 1883, MQTT-over-WebSocket 9001
#   postgres          PostgreSQL 16 â€” experiment/campaign persistence on 5432
#   minio             MinIO object storage â€” API 9000, console 9002
#   helix-agent       Agent service â€” gRPC + HTTP /health on 5080
#   helix-siteserver  SiteServer â€” REST/WebSocket API on 5090
#   helix-recorder    Recorder worker â€” MQTT subscriber â†’ MinIO storage

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: helix-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT/TCP â€” used by Agent and Recorder
      - "9001:9001"   # MQTT over WebSocket â€” used by Tauri/React clients
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "1883", "-t", "helix/healthcheck", "-m", "ping", "-q", "1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16
    container_name: helix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: helix_orchestration
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix_dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helix_orchestration"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:latest
    container_name: helix-minio
    command: server /data --console-address ":9002"
    restart: unless-stopped
    ports:
      - "19000:9000"   # MinIO S3-compatible API
      - "19002:9002"   # MinIO web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 3

  helix-agent:
    build:
      context: .
      dockerfile: Helix.Orchestration.Agent/Dockerfile
    container_name: helix-agent
    restart: unless-stopped
    ports:
      - "5080:5080"
    environment:
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:5080
      Kestrel__Endpoints__Http__Protocols: Http1AndHttp2
      Mqtt__BrokerHost: helix-mosquitto
      Mqtt__BrokerPort: 1883
      ConnectionStrings__HelixOrchestration: Host=helix-postgres;Port=5432;Database=helix_orchestration;Username=helix;Password=helix_dev_password
    depends_on:
      postgres:
        condition: service_started
      mosquitto:
        condition: service_started
    healthcheck:
      # Agent has /health endpoint registered (AddHealthChecks + MapHealthChecks in Program.cs)
      test: ["CMD", "curl", "-f", "http://localhost:5080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  helix-siteserver:
    build:
      context: .
      dockerfile: Helix.Orchestration.SiteServer/Dockerfile
    container_name: helix-siteserver
    restart: unless-stopped
    ports:
      - "5090:5090"
    environment:
      ASPNETCORE_URLS: http://+:5090
      AgentProxy__Mode: grpc
      AgentProxy__GrpcAddress: http://helix-agent:5080
      MqttBridge__BrokerHost: helix-mosquitto
      MqttBridge__BrokerPort: 1883
      MqttBridge__SiteId: site1
      MqttBridge__FumehoodId: fh1
      ConnectionStrings__HelixOrchestration: Host=helix-postgres;Port=5432;Database=helix_orchestration;Username=helix;Password=helix_dev_password
    depends_on:
      helix-agent:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_started
    healthcheck:
      # SiteServer has no /health endpoint; use TCP probe
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/5090' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  helix-recorder:
    build:
      context: .
      dockerfile: Helix.Orchestration.Recorder/Dockerfile
    container_name: helix-recorder
    restart: unless-stopped
    environment:
      Recorder__MqttBrokerHost: helix-mosquitto
      Recorder__MqttBrokerPort: 1883
      Minio__ServiceUrl: http://helix-minio:9000
      Minio__AccessKey: minioadmin
      Minio__SecretKey: minioadmin
      Minio__DefaultBucket: helix-recordings
    depends_on:
      mosquitto:
        condition: service_healthy
      minio:
        condition: service_healthy
    # No healthcheck â€” Recorder is a Worker with no HTTP port

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:
  minio_data:








