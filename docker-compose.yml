# Helix Orchestration — local dev services
# Usage:
#   docker compose up -d          start all services
#   docker compose down -v        stop and remove containers + volumes
#
# Services:
#   mosquitto   MQTT broker — plain TCP 1883, MQTT-over-WebSocket 9001
#   postgres    PostgreSQL 16 — experiment/campaign persistence on 5432
#   minio       MinIO object storage — API 9000, console 9002

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: helix-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT/TCP — used by Agent and Recorder
      - "9001:9001"   # MQTT over WebSocket — used by Tauri/React clients
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  postgres:
    image: postgres:16
    container_name: helix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: helix_orchestration
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix_dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helix_orchestration"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:latest
    container_name: helix-minio
    command: server /data --console-address ":9002"
    restart: unless-stopped
    ports:
      - "9000:9000"   # MinIO S3-compatible API
      - "9002:9002"   # MinIO web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:
  minio_data:
